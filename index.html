<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéTrack</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black min-h-screen">
    <header class="bg-black border-b border-[#202027] " >
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-auto min-h-20 py-4 flex justify-between items-center gap-4">
            <div class="flex items-center gap-3  shrink-0">
                <img class="w-14 h-15 object-contain" src="/img/Logo.png" alt="CinéTrack Logo">
            <div>
               <h1 class="text-2xl font-bold text-[#FFFFFF]" ><span class="text-red-500">Ciné</span>Track</h1>
        </div>
        </div>
        <input id="search" type="text" class="w-full sm:w-96 bg-[#131317] border border-[#24242B] rounded-lg px-4 py-2 outline-none focus:border-[#E80E1B] text-white placeholder-[#9496A1] order-3 sm:order-2" placeholder="Rechercher un film, une série...">
        </div>
    </header>
    <main>
        <h4 class="font-bold p-2 pl-6  text-[#E80E1B] w-auto">VOTRE UNIVERS CINEMA</h4>
        <h1 class="font-extrabold text-4xl text-amber-50 p-2 pl-6">Explorez votre prochain</h1>
        <h1 class="font-extrabold text-4xl text-amber-50 pl-6">coup de cœur.</h1>
        <h4 class="text-[#9496A1] p-5 pl-6">Films et séries à découvrir et à retrouver</h4>
        <section id="movies-container" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-6 p-6"></section>
    </main>
    <footer>
        <div class="text-[#9496A1] p-5 pl-6">© 2026 CinéTrack - All rights reserved</div>
    </footer>
    <script type="module" src="./js/main.js"></script>

</body>
</html>
